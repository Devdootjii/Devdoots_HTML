<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devdoots Capstone - Balram</title>
    <link rel="stylesheet" href="balram_style.css">
</head>
<body>

    <header class="sticky-header">
        <div class="logo">Devdoots</div>
        <nav>
            <a href="#profile">Profile</a>
            <a href="#telemetry">Telemetry</a>
            <a href="#tasks">Tasks</a>
        </nav>
    </header>

    <main>
        
        <section id="profile" class="profile-section">
            <img src="profile.jpeg" alt="Balram Singh" class="profile-img">
            <h1>Balram Singh</h1>
            <p>Data Scientist | AI & ML</p>
            
            <div class="skills-grid">
                <div class="skill-card">Python</div>
                <div class="skill-card">SQL</div>
                <div class="skill-card">C Language</div>
                <div class="skill-card">React</div>
                <div class="skill-card">Git</div>
            </div>
        </section>

        <section id="telemetry" class="telemetry-section">
            <h2>Swarm Robot Telemetry</h2>
            <div class="status">
                System Status <span class="pulse-dot"></span>
            </div>
            <table>
                <tr>
                    <th>Robot ID</th>
                    <th>Battery</th>
                    <th>Signal Strength</th>
                </tr>
                <tr>
                    <td>Alpha-01</td>
                    <td>85%</td>
                    <td>Strong</td>
                </tr>
                <tr>
                    <td>Beta-02</td>
                    <td>42%</td>
                    <td>Weak</td>
                </tr>
                <tr>
                    <td>Gamma-03</td>
                    <td>98%</td>
                    <td>Excellent</td>
                </tr>
            </table>
        </section>

        <section id="tasks" class="form-section">
            <h2>Task Update Form</h2>
            <form>
                <label>Task Name:</label>
                <input type="text" name="task_name" required>

                <label>Priority:</label>
                <select name="priority">
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>

                <label>Upload Log File:</label>
                <input type="file" name="log_file">

                <button type="submit" class="submit-btn">Submit Update</button>
            </form>
        </section>
        
    </main>

    <footer>
        <p>&copy; 2026 Devdoots Team - Balram Singh</p>
    </footer>

</body>
</html>
