<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khushi Yadav | Capstone</title>
    <link rel="stylesheet" href="khushi_style.css">
</head>
<body>

    <header>
        <div class="logo">Devdoots | <span>Khushi</span></div>
        <nav>
            <a href="#skills">Skills</a>
            <a href="#telemetry">Telemetry</a>
            <a href="#form">Form</a>
        </nav>
    </header>

    <main>
        
        <section id="skills" class="section-container">
            <h2>Cloud Tech Stack</h2>
            <div class="grid-container">
                <div class="card">
                    <h3>Python & Linux</h3>
                    <span class="tag">Automation</span>
                </div>
                <div class="card">
                    <h3>AWS Cloud</h3>
                    <span class="tag">EC2 & S3</span>
                </div>
                <div class="card">
                    <h3>Git & GitHub</h3>
                    <span class="tag">CI/CD Workflow</span>
                </div>
            </div>
        </section>

        
        <section id="telemetry" class="section-container">
            <h2>Swarm Robot Telemetry</h2>
            <table>
                <thead>
                    <tr><th>Node ID</th><th>Battery</th><th>Status</th></tr>
                </thead>
                <tbody>
                    <tr><td>Node-01 (AWS EC2)</td><td>92%</td><td><span class="live-badge"></span> Active</td></tr>
                    <tr><td>Node-02 (ML Pipeline)</td><td>78%</td><td><span class="live-badge"></span> Active</td></tr>
                </tbody>
            </table>
        </section>

        
        <section id="form" class="section-container">
            <h2>Telemetry Feedback</h2>
            <form class="custom-form">
                <input type="text" placeholder="Task Name" required>
                <select>
                    <option>In Progress</option>
                    <option>Completed</option>
                </select>
                <button type="submit" class="submit-btn">Submit</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Team Devdoots | Khushi Yadav</p>
    </footer>

</body>
</html>
